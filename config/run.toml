[profiles.configuracoes]
description = "SETTINGS (antigo CALIBRATION) no menu: muda volume e anti-aliasing, passa por todas as abas (LB/RB), fecha e faz LOAD GAME"
fps_limit = 60
test = true
timeout = 50
audio = false
userdata_mode = "copy"
skip_intros = true
# Tempos a partir do menu principal (@main_menu). DOWN x3, A = SETTINGS (abre a tela na aba JOGO);
