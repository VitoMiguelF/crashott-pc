# Controle de execução e testes do CrashRecomp.
# Lido por tools/run_game.py:
#
#   python tools\run_game.py jogar          (compila e abre o jogo com os seus saves, dist\userdata)
#   python tools\run_game.py boot           (roda um perfil e confere o resultado)
#   python tools\run_game.py boot --dist    (o mesmo com dist\CrashRecomp.exe, como o jogador abre)
#   python tools\run_game.py --all          (roda todos os perfis com test = true; demora)
#   python tools\run_game.py --list         (lista os perfis)
#   python tools\run_game.py boot --set timeout=60 --set audio=true
#
# Caminhos relativos são relativos à pasta do projeto (CrashRecomp).
# Todo teste roda numa cópia de tests/userdata_base (saves e settings.toml fixos); só o perfil
# jogar usa a sua userdata de verdade (dist/userdata).
#
# Perfis gravados jogando (F5 em qualquer execução, ou o perfil gravar) ficam em
# config/recorded/<nome>.toml, um por arquivo, e aparecem aqui como os outros (--list).
#
# Os testes não dependem mais do relógio para passar pelas intros e menus: boot = "..." entra direto
# na fase ou no save pelo código do jogo, e os botões ficam ancorados em eventos (["@gameplay_ready"]).

[paths]
exe = "build/CrashRecomp.exe"             # o exe compilado (--dist usa dist/CrashRecomp.exe)
game = ""                                 # sua cópia do jogo (somente leitura); vazio = config/local.toml ou o [paths] game de dist/userdata/settings.toml (tools/buildenv.py)
mods = "dist/mods"                        # os mods do jogo (a mesma pasta que o dist\CrashRecomp.exe usa)
userdata = "dist/userdata"                # seus saves e opções de verdade: só o perfil jogar (userdata_mode = "shared") usa
test_userdata = "tests/userdata_base"     # base fixa dos testes (saves + settings.toml); cada execução usa uma cópia dela
test_shadercache = "tests/shadercache"    # cache de shaders dos testes (os shaders novos de cada execução entram aqui)
languages = "languages"                   # pacotes de idioma (fonte; o make_dist copia para dist\languages)
data = "private"                          # dados opcionais tirados do seu jogo: subtitles\, symbols\, remaster_full\
dist = "dist"                           # a pasta para jogar (tools/make_dist.py)
runs = "build/runs"                       # cada execução ganha uma pasta aqui (log, capturas, áudio, resultado)

[build]
# Compila antes de rodar (só o que mudou). Desligue com --no-build.
auto = true
# O toolchain vem do tools/buildenv.py: o portátil de toolchain\ (llvm-mingw, CMake, Ninja), ou com
# [build] toolchain = "msvc" em config/local.toml o Visual Studio (vswhere) + clang-cl.
build_dir = "build"
target = "CrashRecomp"

# Valores usados por todos os perfis; cada perfil pode sobrescrever qualquer um.
[defaults]
timeout = 0            # segundos até o watchdog encerrar o jogo (0 = sem limite)
audio = true           # false = não abre dispositivo de áudio (CRASH_NOAUDIO)
render = true          # false = sem janela/renderização (CRASH_NO_RENDER)
symbols = true         # nomes de funções (RTTI) nas mensagens de crash
# fps_limit = 60 (por perfil): limite de FPS da execução; a base de testes roda sem limite, e os
# testes de menu travam em 60 porque, a centenas de fps, os menus perdem os botões do script.
# "copy" (o padrão): a pasta da execução recebe uma cópia de tests/userdata_base (saves e
# settings.toml) e do cache de shaders dos testes; o teste pode sobrescrever slots e opções sem
# mexer na base nem nos seus saves. "shared": a sua userdata de verdade (só o perfil jogar).
userdata_mode = "copy"
screenshots = []       # números de quadro (VdSwap) em que salvar uma captura
audio_dump = false     # grava a mixagem em audio.wav na pasta da execução
audio_dump_seconds = 60
log_imports = []       # imports a logar em toda chamada (CRASH_LOG_IMPORTS)
log_all_io = false
gpu_debug = false      # validation layers do Vulkan + validação de sincronização (CRASH_GPU_DEBUG; precisa do Vulkan SDK)
# Botões do controle 0: [segundos desde a primeira leitura do controle, "BOTÃO"] (relógio de parede).
# Botões: A B X Y START BACK UP DOWN LEFT RIGHT LB RB L3 R3 (cada um fica apertado por 200 ms;
# [segundos, "BOTÃO", segundos_apertado] segura por mais tempo, ex.: [80, "RIGHT", 1.5]).
# Analógicos: LS_UP etc. (até o fim) ou [s, "LS"/"RS", x, y, (segundos)] e [s, "LT"/"RT", v, (segundos)].
# [s, "SHOT"] = captura. Âncoras: depois de ["@evento"] (ou ["@evento#n"], a n-ésima vez) os tempos
# contam a partir daquele evento do jogo, e uma entrada espera o evento acontecer: ["@main_menu"],
# [2, "DOWN"] aperta DOWN 2 s depois de o menu aparecer. Eventos: title, main_menu, save_slots,
# load_complete, hub, level_start, level_ready, cinematic, gameplay_ready, pause, game_over,
# boot_done, boot_failed (README, "Boot direto e eventos"). ["@start"] volta ao relógio do input.
input = []
# Boot direto pelo próprio código do jogo (CRASH_BOOT): "menu" (pula as intros), "level:L1_E3" (a
# fase, sem save), "load:1" (LOAD GAME no slot 1 + CONTINUE STORY), "load:1:hub" (para no menu do
# episódio), "load:1:L1_E3" (a fase escolhida no menu do episódio, com o progresso do save).
# skip_intros = true: só pula os vídeos de logo e a tela de título (CRASH_SKIP_INTROS).
# expect.events = ["gameplay_ready", "main_menu#2"]: eventos que precisam acontecer; com boot, o
# evento boot_failed sempre falha o teste.
# replay = [...]: entradas no relógio do jogo, com SYNC nos carregamentos (é o que o F5 grava;
# veja config/recorded e o README, "Gravando um perfil jogando").
# userdata_from = "pasta": com userdata_mode = "copy", copia content\ e settings.toml dela em vez da base.
env = {}               # variáveis extras, ex.: { CRASH_GPU_TRACE = "1" }
# Overlay de desempenho: true = completo (quadro, relógio do input, FPS, frame time, resolução,
# perfil e último botão), false = o modo do settings.toml, ou "off" | "fps" | "frametime" | "full".
# F1 troca o modo, F2 marca o quadro (marks.txt), F12 tira um print.
overlay = true
screenshot_overlay = false   # true = o overlay também sai nas capturas
record_input = false   # true = começa a gravar (como o F5) já no boot; o perfil vai para config/recorded
perf_from_frame = 0    # estatísticas de frame time (resumo/result.json/expect) a partir deste quadro
# Checagens de desempenho opcionais em expect: min_fps, max_frame_ms_p99, max_hitches (> 50 ms).

[profiles.jogar]
description = "Abre o jogo para jogar, sem limite de tempo e com os seus saves"
test = false
userdata_mode = "shared"   # o único perfil que usa a sua userdata de verdade
expect = { exit = ["ok"] }

[profiles.gravar]
description = "Joga numa cópia dos saves gravando o controle desde o boot (F5 ou fechar a janela salva o perfil em config/recorded)"
test = false
userdata_mode = "copy"
record_input = true
expect = { exit = ["ok"] }

[profiles.boot]
description = "Boot até o loop de quadros: logos, áudio XMA, sem crash"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
screenshots = [300, 540]
expect = { exit = ["timeout"], min_frames = 480, log_absent = ['\[fatal\]', '\[crash\]'] }

[profiles.menu]
description = "Pula as intros (skip_intros: sem vídeos de logo e sem tela de título) e chega ao menu principal com música"
fps_limit = 60
test = true
timeout = 25
audio = false
userdata_mode = "copy"
skip_intros = true
audio_dump = true
audio_dump_seconds = 25
input = [["@main_menu"], [2, "SHOT"], [10, "SHOT"]]
expect = { exit = ["timeout"], events = ["main_menu"], log_absent = ['\[fatal\]', '\[crash\]'] }

[profiles.menu_loaded]
description = "LOAD GAME no primeiro slot até o menu do episódio (boot load:1:hub, pelas saídas do próprio frontend)"
fps_limit = 60
test = true
timeout = 30
audio = false
userdata_mode = "copy"
boot = "load:1:hub"
input = [["@hub"], [3, "SHOT"]]
expect = { exit = ["timeout"], events = ["main_menu", "hub", "boot_done"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['XamContentCreateEx\(.*\(opened\)'] }

[profiles.load_pelos_menus]
description = "Ponta a ponta pela interface: LOAD GAME só com botões (DOWN, A, slot 1, CONTINUE, Y) até a fase, cada botão ancorado na tela em que cai"
fps_limit = 60
test = true
timeout = 50
audio = false
userdata_mode = "copy"
skip_intros = true
# Cada ["@evento"] faz os tempos seguintes contarem a partir daquele evento (README, "Boot direto e
# eventos"): o menu, a tela de saves, "load complete", o menu do episódio e a fase.
input = [
    ["@main_menu"], [2, "DOWN"], [3, "A"],
    ["@save_slots"], [1, "SHOT"], [1.5, "A"],
    ["@load_complete"], [1, "A"],
    ["@hub"], [1.5, "SHOT"], [2, "Y"],
    ["@gameplay_ready"], [1, "SHOT"],
]
expect = { exit = ["timeout"], events = ["main_menu", "save_slots", "load_complete", "hub", "level_start", "gameplay_ready"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['XamContentCreateEx\(.*\(opened\)'] }

[profiles.primeira_fase]
description = "Ponta a ponta pela interface: NEW GAME (nome, NORMAL, slot 1 sobrescrito) pelo piloto automático de menus, cena de abertura e a vila"
fps_limit = 60
test = true
timeout = 150
audio = false
userdata_mode = "copy"
skip_intros = true
# CRASH_MENU_AUTOPILOT=newgame aperta o botão de cada tela assim que ela aparece (A em NEW GAME,
# nome "A", Y, NORMAL, slot 1, DOWN + A para sobrescrever, CONTINUE): os botões passam pelo caminho
# do controle de verdade, sem horário fixo. A cena de abertura não pula (~100 s).
env = { CRASH_MENU_AUTOPILOT = "newgame" }
input = [["@cinematic"], [5, "SHOT"], ["@gameplay_ready"], [1, "SHOT"], [2, "LS", 0, 1, 2], [4.5, "SHOT"]]
expect = { exit = ["timeout"], events = ["main_menu", "level_start", "cinematic", "gameplay_ready"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['menu autopilot: last step pressed', 'level_start .*: L1_E1'] }

[profiles.primeiro_slot_load]
description = "LOAD GAME no primeiro slot e CONTINUE STORY até a fase (episódio 2) pelo boot load:1"
test = true
timeout = 40
audio = false
userdata_mode = "copy"
boot = "load:1"
input = [["@gameplay_ready"], [1, "SHOT"]]
expect = { exit = ["timeout"], events = ["hub", "level_start", "gameplay_ready"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['level_start .*: L1_E2'] }

[profiles.fase_direta]
description = "Boot direto numa fase sem save (level:L1_E3, a fase com cena de abertura): o caminho SkipToLevel dos desenvolvedores; anda depois da cena e pausa"
