expect = { exit = ["timeout"], events = ["level_start", "level_ready", "cinematic", "gameplay_ready", "pause"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['SkipToLevel, StartLevel 2 L1_E3'] }

[profiles.vila_sem_cena]
