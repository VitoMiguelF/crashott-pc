timeout = 50
audio = false
userdata_mode = "copy"
boot = "level:L1_E1"
skip_cinematics = true
# P2 entra com B; Y só solta da mochila uns segundos depois de entrar (aos 2,5 s ainda não), por isso
# vai três vezes.
