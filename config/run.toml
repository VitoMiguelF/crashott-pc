[profiles.iluminacao_tela]
description = "SETTINGS > DEFINITIVE EDITION > ILUMINAÇÃO (REMASTER): liga SSAO ALTA, luz indireta 110%, sombras de contato e suaves pelo controle, salva, faz LOAD GAME, continua a história (Y no HUB) e confere a iluminação na fase"
fps_limit = 60
test = true
timeout = 70
audio = false
userdata_mode = "copy"
skip_intros = true
skip_cinematics = true
# Do menu principal: DOWN x3, A = SETTINGS (aba JOGO); LB = DEFINITIVE EDITION (a última aba);
# DOWN x2 = OCLUSÃO DE AMBIENTE (o título do subgrupo é pulado); RIGHT x2 = ALTA; DOWN, RIGHT = luz
# indireta; DOWN, RIGHT = intensidade 110%; DOWN, RIGHT = sombras de contato; DOWN, RIGHT = suaves;
# B salva e volta (nada pede reinício); DOWN, A = LOAD GAME.
input = [
    ["@main_menu"],
    [2, "DOWN"], [3, "DOWN"], [4, "DOWN"], [5, "A"],
    [6.5, "LB"], [7.2, "DOWN"], [7.6, "DOWN"], [8, "RIGHT"], [8.4, "RIGHT"],
    [8.8, "DOWN"], [9.2, "RIGHT"], [9.6, "DOWN"], [10, "RIGHT"], [10.4, "DOWN"], [10.8, "RIGHT"], [11.2, "DOWN"], [11.6, "RIGHT"],
    [12.5, "SHOT"], [13, "B"],
    [15, "SHOT"], [16, "DOWN"], [17, "A"],
    ["@save_slots"], [1.5, "A"],
    ["@load_complete"], [1, "A"],
    ["@hub"], [2, "SHOT"], [3, "Y"],
    ["@gameplay_ready"], [3, "SHOT"],
]
expect = { exit = ["timeout"], events = ["main_menu", "save_slots", "hub", "gameplay_ready"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['\[settings\] tab -> definitive', 'lighting\.ssao -> HIGH', 'lighting\.gi -> ON', 'lighting\.gi_intensity -> 110%', 'lighting\.contact_shadows -> ON', 'lighting\.soft_shadows -> ON', '\[settings\] saved', '\[lighting\] targets'] }

[profiles.pular_cena]
