expect = { exit = ["timeout"], events = ["level_start", "level_ready", "cinematic", "cinematic_skipped", "cinematic_done", "gameplay_ready", "pause"], log_absent = ['\[fatal\]', '\[crash\]'], log_contains = ['SkipToLevel, StartLevel 0 L1_E1'] }

[profiles.coop_p2]
description = "Co-op local: boot direto na vila L1_E1 sem a cena; um segundo controle virtual (entradas P2_ do script) entra com B (JOIN GAME) montado no jogador 1, desce com Y, anda e pula como jogador 2 e pausa com START (P2 PAUSED)"
