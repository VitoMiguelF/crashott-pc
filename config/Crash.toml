# XenonRecomp config for Crash of the Titans (Xbox 360, title ID 565507E4, Crash007f.exe)
# Paths are relative to this file.

[main]
file_path = "../private/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "Crash_switch_tables.toml"

# Optimizations (2026-10-22, runtime/NOTES.md "Desempenho"): registers as C++ locals instead of
# PPCContext fields, so the compiler keeps them in host registers. The runtime reads LR only in
# logs, CTR only in the unmapped-indirect-call report. non_argument_as_local breaks the SEH
# __finally funclets, which get the parent's frame in r12 (sub_82268B14: addi r31,r12,-320).
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (unique byte-pattern matches in .text).
restgprlr_14_address = 0x823CEC30
savegprlr_14_address = 0x823CEBE0
restfpr_14_address = 0x823CFF1C
savefpr_14_address = 0x823CFED0
# No __savevmx_*/__restvmx_* helpers exist in this binary (no pattern matches), so they are omitted.

# longjmp restores f14-f31/r13-r31/LR/CR/r1 from the jmp_buf in r3 and calls RtlUnwind when
# jmp_buf+0x138 is set; setjmp (leaf, no .pdata entry) writes the same layout and returns 0.
longjmp_address = 0x823D2EA0
setjmp_address = 0x823D2FC0

functions = [
    # Leaf functions without .pdata (red-zone locals below r1) in gaps between .pdata entries:
    # some found by hand (0x8237F8F8..0x82380738), the rest generated from jump tables the linear
    # scan cut short, then split at entries referenced by data function-pointer tables or by
    # addresses built in code (lis/addi). Check with tools/find_swallowed.py after any change here.
